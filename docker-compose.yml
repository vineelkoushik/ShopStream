
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/auth_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  product:
    build: ./services/products
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/product_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order:
    build: ./services/orders
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/order_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
      - PRODUCT_SERVICE_URL=http://product:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product:
        condition: service_started

  product_worker:
    build: ./services/products
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/product_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment_worker:
    build: ./services/payments
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/payment_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order_worker:
    build: ./services/orders
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/order_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  outbox_relay:
    build: ./services/orders
    command: python -m app.outbox_relay
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/order_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    build: ./services/notifications
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/notification_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification_worker:
    build: ./services/notifications
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/notification_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    image: nginx:stable
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
