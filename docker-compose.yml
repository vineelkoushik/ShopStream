services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/auth_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    
    depends_on:
      postgres:
        condition: service_healthy

  order:
    build: ./services/orders
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:shopstream_secret_123@postgres:5432/order_db
      - JWT_SECRET=super_secret_key_change_me_later
      - JWT_ALGORITHM=HS256
      - PRODUCT_SERVICE_URL=http://host.docker.internal:8002
      - PAYMENT_SERVICE_URL=http://host.docker.internal:8004
    
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:stable
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: