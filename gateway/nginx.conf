events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    include /etc/nginx/mime.types;
    default_type application/json;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_types application/json;
    gzip_min_length 1000;

    upstream auth_up {
    zone auth_zone 64k;
    server auth:8000 resolve;
    }

    upstream order_up {
        zone order_zone 64k;
        server order:8000 resolve;
    }

    upstream product_up {
        server 172.29.112.1:8002;
    }

    upstream payment_up {
        server 172.29.112.1:8004;
    }

    server {
        listen 80;

        error_page 502 503 504 = @json_errors;
        location @json_errors {
            internal;
            return 503 '{"detail": "Service temporarily unavailable. Please try again later."}';
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://auth_up/auth/login;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }
        
        location = /api/auth/health {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://auth_up/health;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://auth_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/products/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/products/(.*)$ /products/$1 break;
            proxy_pass http://product_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/orders/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/orders/(.*)$ /orders/$1 break;
            proxy_pass http://order_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/payments/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/payments/(.*)$ /payments/$1 break;
            proxy_pass http://payment_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}